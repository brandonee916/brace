name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  analyze:
    name: Analyze Swift
    # Brace builds for arm64-apple-macos14.0, so it needs an Apple-silicon runner
    # with the Xcode toolchain already installed.
    runs-on: macos-15
    # The Swift extractor builds its database while swiftc runs, so the build
    # step takes about half an hour for a twenty-second compile. An hour leaves
    # room for that without letting a wedged run sit for the six-hour default.
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # There is no Xcode project or Package.swift for autobuild to find —
          # the app is compiled by build.sh calling swiftc directly.
          build-mode: manual

      - name: Build Brace
        run: ./build.sh

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
