name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "Resources/*.png"
      - "Resources/*.icns"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "Resources/*.png"
      - "Resources/*.icns"
  # Nothing listed above reaches the Swift the scan reads. The weekly run
  # covers them regardless, and re-checks unchanged code against newer queries.
  schedule:
    - cron: "0 9 * * 1"

jobs:
  analyze:
    name: Analyze Swift
    # Brace builds for arm64-apple-macos14.0, so it needs an Apple-silicon runner
    # with the Xcode toolchain already installed.
    runs-on: macos-15
    # The Swift extractor builds its database while swiftc runs, so the compile
    # step takes about eight minutes for what is a twenty-second build. Half an
    # hour leaves room for that without letting a wedged run sit for the
    # six-hour default.
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # There is no Xcode project or Package.swift for autobuild to find —
          # the app is compiled by calling swiftc directly.
          build-mode: manual

      # CodeQL reads the Swift as it compiles, so the app bundle build.sh makes
      # is not needed. Without -O, swiftc splits the sources across parallel
      # compiler jobs instead of one whole-module job, and the extractor runs
      # in each of them rather than in a single long one.
      - name: Compile the Swift sources
        run: |
          swiftc \
            -parse-as-library \
            -Onone \
            -j3 \
            -target arm64-apple-macos14.0 \
            -o "$RUNNER_TEMP/Brace" \
            Sources/*.swift

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
